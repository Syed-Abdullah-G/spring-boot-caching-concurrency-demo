spring.application.name=spring-boot-demo2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/spring-boot-demo
spring.datasource.username=root
spring.datasource.password=hellokitty
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cache: a cache named "users", max 500 users, each entry expires 10 minutes after it was saved
spring.cache.type=caffeine
spring.cache.cache-names=users
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
